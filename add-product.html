<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | Shivani Wood Craft</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="login-box">

    <h1>ADD PRODUCT</h1>

    <input type="text" id="code" placeholder="Product Code">

    <input type="text" id="name" placeholder="Product Name">

    <input type="number" id="price" placeholder="Price">

    <input
        type="text"
        id="image"
        placeholder="Image Name (Example: product (45).jpeg)">

    <textarea
        id="description"
        placeholder="Product Description"
        style="width:100%;height:120px;padding:12px;margin:10px 0;box-sizing:border-box;border-radius:5px;">
    </textarea>

    <button id="saveBtn">
        Save Product
    </button>
    <button class="back-btn" onclick="window.location.href='dashboard.html'">
    ← Back
</button>

</div>

<script type="module" src="add-product.js"></script>

</body>
</html>
