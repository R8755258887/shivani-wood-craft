<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Product</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#111;
    color:#fff;
    font-family:Arial;
}

.container{

    max-width:700px;
    margin:40px auto;
    background:#1d1d1d;
    padding:30px;
    border-radius:10px;

}

h1{

    color:#FFD700;
    text-align:center;
    margin-bottom:25px;

}

input,
textarea{

    width:100%;
    padding:12px;
    margin:10px 0;
    font-size:16px;
    border-radius:8px;
    border:none;
    outline:none;

}

img{

    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:10px;
    display:block;
    margin:20px auto;

}

button{

    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#FFD700;
    cursor:pointer;
    font-weight:bold;

}

button:hover{

    background:#ffcc00;

}
.back-btn{
    width:100%;
    padding:15px;
    margin-top:15px;
    background:#FFD700;
    color:#000;
    border:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>Edit Product</h1>

<img
id="previewImage"
src="images/no-image.png">

<input
id="code"
placeholder="Product Code">

<input
id="name"
placeholder="Product Name">

<input
id="price"
type="number"
placeholder="Price">

<div class="image-edit-box">

    <input
        id="image"
        placeholder="Image Name"
        readonly>

    <button
        type="button"
        id="selectImageBtn">
        📁 Select Image
    </button>

    <input
        type="file"
        id="imageFile"
        accept=".jpg,.jpeg,.png"
        hidden>

</div>

<textarea
id="description"
rows="5"
placeholder="Description"></textarea>

<button id="saveBtn">

💾 Save Changes

</button>

<button class="back-btn" onclick="window.location.href='manage-products.html'">
    ← Back
</button>

</div>

<script type="module" src="edit-product.js"></script>

</body>

</html>
